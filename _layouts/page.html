---
layout: default
---
{% include base_path %}
{% unless page.hide_title %}
<header class="band band--page">
  <div class="band__inner">
    {% if page.kicker %}<p class="band__kicker">{{ page.kicker }}</p>{% endif %}
    <h1 class="band__title">{{ page.title }}</h1>
    {% if page.lede %}<p class="band__lede">{{ page.lede }}</p>{% endif %}
  </div>
</header>
{% endunless %}
{% if page.hero %}{% include hero.html %}{% endif %}
<div id="main" role="main">
  <article class="page">
    <div class="page__content">{{ content }}</div>
  </article>
</div>
