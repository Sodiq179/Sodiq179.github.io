{% include base_path %}
<a class="skip-link" href="#main">Skip to content</a>
<header class="masthead">
  <div class="masthead__inner-wrap">
    <a href="{{ base_path }}/" class="site-brand"><span class="site-brand__mark" aria-hidden="true">SB</span><span class="site-brand__name">{{ site.title }}</span></a>
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav" aria-label="Main">
        <ul class="visible-links">
          <li class="masthead__menu-item {% if page.url == '/' %}selected{% endif %}">
            <a href="{{ base_path }}/"{% if page.url == '/' %} aria-current="page"{% endif %}>About</a>
          </li>
          {% for link in site.data.navigation.main %}
            {% assign is_current = false %}
            {% if page.url contains link.url and link.url != '/' %}{% assign is_current = true %}{% endif %}
            <li class="masthead__menu-item {% if is_current %}selected{% endif %}">
              <a href="{{ base_path }}{{ link.url }}"{% if is_current %} aria-current="page"{% endif %}>{{ link.title }}</a>
            </li>
          {% endfor %}
          <li id="theme-toggle" class="masthead__menu-item persist tail">
            <button type="button" aria-label="Switch between light and dark mode"><i id="theme-icon" class="fa-solid fa-sun" aria-hidden="true"></i></button>
          </li>
        </ul>
        <button class="greedy-nav__toggle" type="button" aria-label="Open menu"><span class="navicon"></span></button>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</header>
