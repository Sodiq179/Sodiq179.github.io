{% include base_path %}

<!-- start custom head snippets -->
<script src="{{ base_path }}/assets/js/jquery.min.js"></script>

<!-- Fonts: Source Serif 4 for headings, Inter for text -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap">

<!-- Academicons (Google Scholar icon), self-hosted -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.min.css">

<!-- Font Awesome -->
<link rel="preload" href="{{ base_path }}/assets/css/fontawesome.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="{{ base_path }}/assets/css/fontawesome.css"></noscript>

<!-- Apply the saved or system colour theme before first paint, so the page never flashes -->
<script>
  (function () {
    try {
      var t = localStorage.getItem("theme");
      if (t === "dark" || ((!t || t === "system") && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    } catch (e) {}
  })();
</script>

<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<meta name="theme-color" content="#143460"/>
<meta name="author" content="Sodiq Babawale">
<!-- end custom head snippets -->
